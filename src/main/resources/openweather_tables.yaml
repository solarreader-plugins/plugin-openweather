- table: "aktuellesWetter"
  rows:
  - columns:
    - name: "Himmel"
      datatype: "STRING"
      expression: "weather_0_description"
    - name: "Datum"
      datatype: "STRING"
      expression: "DT_DATE_FORMAT(CURRENT, \"dd.MM.yyyy HH:mm\")"
    - name: "Sonnenaufgang"
      datatype: "STRING"
      expression: "DT_DATE_FORMAT(sys_sunrise, \"HH:mm\")"
    - name: "Temperatur"
      datatype: "NUMBER"
      expression: "main_temp"
    - name: "Windrichtung"
      datatype: "NUMBER"
      expression: "wind_deg"
    - name: "Ort"
      datatype: "STRING"
      expression: "name"
    - name: "Regenmenge"
      datatype: "NUMBER"
      expression: "IF(rain_3h > 0, rain_3h, rain_1h)"
    - name: "Schnee"
      datatype: "NUMBER"
      expression: "IF(snow_3h > 0, snow_3h, snow_1h)"
    - name: "Sonnenuntergang"
      datatype: "STRING"
      expression: "DT_DATE_FORMAT(sys_sunset, \"HH:mm\")"
    - name: "Luftfeuchte"
      datatype: "NUMBER"
      expression: "main_humidity"
    - name: "Wind"
      datatype: "NUMBER"
      expression: "wind_speed"
    - name: "Luftdruck"
      datatype: "NUMBER"
      expression: "main_pressure"
    - name: "Wolkendichte"
      datatype: "NUMBER"
      expression: "clouds_all"
